name: resume

on:
  push:
    branches: [main]
    paths:
      - src/data/resume.ts
      - src/data/projects.ts
      - src/lib/resume.ts
      - src/lib/types/resume.ts
      - scripts/build-resume.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resume
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: wtfjoke/setup-tectonic@5e1ba6e10229bd876c6594189bdab1a62b9d0b1c # v4.0.6
      - run: node scripts/build-resume.mjs
      - name: Commit rebuilt PDFs
        run: |
          git add public/resume
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild resume PDFs"
          git push
